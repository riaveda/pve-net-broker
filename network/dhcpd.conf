# PVE Net Broker — DHCP base config (ISC dhcpd)
# Managed by: git repo /opt/pve-net-broker
#
# DO NOT EDIT /etc/dhcp/dhcpd.conf directly (it is a symlink to this file).
#
# 이 파일(base)은 전역 옵션 + subnet 선언만 담습니다. 거의 수정할 일 없음.
# VM별 고정 IP(host 블록)는 아래 include 되는 dhcp-hosts.conf 에서만 관리합니다.

# option definitions common to all supported networks...
#
# ⚠️ 여기에 원래 배포판 예제의 `option domain-name "example.org";` +
#    `option domain-name-servers ns1.example.org, ns2.example.org;` 가 그대로 남아 있었다.
#    실제 피해가 있어 제거했다(2026-07-31):
#      · `domain-name` 은 **모든 VM 의 검색 도메인**이 된다(systemd-resolved → resolv.conf `search`).
#        example.org 아래엔 우리 이름이 하나도 없는데, 이름을 찾을 때마다 **거기부터 붙여 보게** 된다.
#        상위 DNS 가 그 존에 정상 응답을 못 주면(실측: SERVFAIL·빈 정상응답) 이름 해석기 종류에 따라
#        **거기서 조회를 멈춘다** → 컨테이너 안에서 github.com 같은 이름이 통째로 안 풀렸다.
#      · `domain-name-servers` 의 ns1/ns2.example.org 는 **존재하지 않는 이름**이다.
#        아래 subnet 블록이 실제 값(10.231.3.11)으로 덮어써서 지금까지 드러나지 않았을 뿐,
#        subnet 밖 경로가 생기면 그대로 거짓 정보가 나간다.
#    → 전역 기본값은 두지 않는다. DNS 는 subnet/host 블록에서 실제 값으로만 준다.
#    (검색 도메인이 필요해지면 그때 **실재하는 도메인**을 여기에 선언한다.)

default-lease-time 600;
max-lease-time 7200;

# The ddns-updates-style parameter controls whether or not the server will
# attempt to do a DNS update when a lease is confirmed. We default to the
# behavior of the version 2 packages ('none', since DHCP v2 didn't
# have support for DDNS.)
ddns-update-style none;

# If this DHCP server is the official DHCP server for the local
# network, the authoritative directive should be uncommented.
#authoritative;

# Use this to send dhcp log messages to a different log file (you also
# have to hack syslog.conf to complete the redirection).
#log-facility local7;

subnet 10.10.10.0 netmask 255.255.255.0 {
  range 10.10.10.2 10.10.10.50;
  option domain-name-servers 10.231.3.11;
  option routers 10.10.10.1;
  option subnet-mask 255.255.255.0;
  option broadcast-address 10.10.10.255;
}

# ── 고정 IP host 예약은 dhcp-hosts.conf 에서 관리 (VM 추가 시 그 파일만 수정) ──
# 경로는 /etc/dhcp/ 안이어야 함 (dhcpd가 AppArmor로 /etc/dhcp 밖을 못 읽음).
# `pnbctl dhcp reload`가 레포의 dhcp-hosts.conf를 /etc/dhcp/로 복사해 준다.
include "/etc/dhcp/dhcp-hosts.conf";

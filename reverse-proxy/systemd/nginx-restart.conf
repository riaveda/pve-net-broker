# nginx 자동 복구 — `/etc/systemd/system/nginx.service.d/restart.conf` 로 설치된다.
#
# 왜 필요한가: 이 VM 하나에 `swp-iot.lge.com` 의 80/443 **전부**가 얹혀 있다. 여기가 멈추면
#   gitlab·build·agent·homey-nexus 가 **동시에** 끊기고, 지금은 사람이 브라우저를 열어야 안다.
#   프로세스가 죽는 종류의 장애(OOM·일시적 오류)는 스스로 살아나는 것이 맞다.
#
# ⚠️ 배포판 기본 유닛은 Restart 를 걸지 않는다 — **설정이 잘못돼 죽은 것까지 되살리면**
#   무한 재시작이 되어 장애를 감추기만 하기 때문이다. 그래서 조건을 좁힌다:
#   실패로 죽었을 때만(`on-failure`) · 간격을 두고 · **짧은 시간에 반복되면 포기**한다.
#   포기 조건이 없으면 "죽은 채로 계속 재시작"이 되어 원인을 영영 못 본다.
#
# ⛔ 이 파일을 .42 에서 직접 만들지 않는다 — 서버를 바꾸면 아무도 기억하지 못한다.
#    `pnbctl proxy deploy` 가 내용이 다를 때만 설치한다(멱등).

[Unit]
# 5분 안에 5번 넘게 실패하면 멈춘다 — 그 이상은 재시작으로 낫는 고장이 아니다.
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=2s

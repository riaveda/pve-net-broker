# 리버스프록시 공용 라우팅 본문 — :80(현재) + 준비된 :443(tls-available) 이 함께 include.
# 라우팅은 여기 한 곳에서만 정의(단일 소스) — 두 곳에 중복하면 드리프트한다.
# 절대경로 include 라 nginx prefix 무관(아래 dev-routes include 와 동일 패턴).

root /var/www/reverse-proxy;
index index.html;

# https(:443) 응답 전부에 Upgrade-Insecure-Requests — 값은 reverse-proxy.conf 의 `$ap_csp_upgrade` 맵
# (:80 이면 빈 값 → 헤더 자체가 나가지 않는다). 사유는 그 맵의 주석. 서버 문맥에 두어 아래 모든 location
# (프록시 응답 포함)에 상속된다. ⚠️ 자기 add_header 를 가진 location 은 nginx 규칙상 상속받지 못한다 —
# 아래 셋(rootCA.crt 내려받기 · /__ap_bootstrap · /__ap_probe.gif)이 그렇지만 하위 요청을 만드는 문서가
# 아니라 무관하다. 문서를 내는 location 에 add_header 를 새로 넣으면 이 줄을 그 안에 함께 적을 것.
# `always` = 오류 응답(4xx·5xx 페이지)에도 싣는다 — 그 페이지도 문서다.
add_header Content-Security-Policy $ap_csp_upgrade always;

# 포털 안내 페이지 (정적). 소스는 별도 GitHub private 레포
# (riaveda/swp-iot-portal-frontend)이고 .42 의 riaveda 계정이 build/serve 한다.
# 이 root(/var/www/reverse-proxy)는 .42 에서 심볼릭으로
# /home/riaveda/swp-iot-portal-frontend/dist (레포 이름 그대로 — `portal` 아님) 를
# 가리킨다. (2026-09 이관: GitLab→GitHub · portal-frontend→riaveda.
#  구 /home/portal-frontend/portal 은 롤백용으로 보존 중.)
# ⚠ nginx 워커는 www-data 라 /home/riaveda 가 0751(other에 x)이어야 traverse 된다 —
#   0750 으로 조이면 포털이 깨진다.
location / {
    try_files $uri $uri/ =404;
}

# ── 설치 안내 허브 /setup/ (http 로 제공 — 경고 없이 받아 설치하게) ──
# /setup/               안내 허브(항목 목록). 새 설치 항목은 onboarding/<name>/ 로 확장.
# /setup/rootca/        사내 루트 CA 설치 페이지 + 원클릭 스크립트(install-root.bat/.command). 레포 onboarding/ 서빙.
# /setup/rootca/rootCA.crt  루트 공개 인증서. 활성화 시 .42:/etc/nginx/ssl/rootCA.crt 배치(없으면 404 — 무해).
# 상세: reverse-proxy/docs/tls-setup.md · 사유: https-transition-rationale.md
location = /setup        { return 301 /setup/; }
location = /setup/rootca { return 301 /setup/rootca/; }
location = /setup/rootca/rootCA.crt {
    alias /etc/nginx/ssl/rootCA.crt;
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="rootCA.crt"';
}
location /setup/ {
    alias /home/riaveda/reverse-proxy/nginx/onboarding/;
    index index.html;
}

# ── https 유도 내부 핸들러 (reverse-proxy.conf 의 조건부 로직이 활성일 때만 도달) ──
# /__ap_bootstrap  :80 브라우저 nav 를 잠깐 받아 JS probe → 신뢰면 https, 아니면 /setup/rootca 로.
# /__ap_probe.gif  :443 에서만 의미 — 브라우저가 이 https 리소스를 로드 성공하면 "루트 신뢰"로 판정.
location = /__ap_bootstrap {
    alias /home/riaveda/reverse-proxy/nginx/onboarding/_bootstrap.html;
    default_type text/html;
    add_header Cache-Control "no-store";
}
location = /__ap_probe.gif {
    empty_gif;
    add_header Cache-Control "no-store";
    # 이 응답이 **https 로** 성사됐다 = 이 브라우저가 우리 루트를 신뢰한다 → 그 자리에서 표식을 심는다.
    # (:80 이면 $ap_trust_cookie 가 빈 값이라 헤더 자체가 나가지 않는다 — 거짓 신뢰가 생길 수 없다.)
    add_header Set-Cookie $ap_trust_cookie;
}

# ── 서비스 라우팅 ──
# ── GitLab ──
location /gitlab {
    proxy_pass http://10.10.10.36:5050;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 파일 업로드 / git push 대비
    client_max_body_size 0;

    # git clone, 큰 응답 대비 타임아웃
    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;
    proxy_buffering       off;
}
# ── Build-Center ──
location /build {
    proxy_pass http://10.10.10.41:4050;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket (SSH 터미널, 빌드 로그 스트림)
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    client_max_body_size 0;

    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;
    proxy_buffering       off;
}
# ── Agent-Platform ──
# ⚠️ 2026-09-18 현재 VM 117 이 **의도적으로 정지**돼 있다(사용자가 한동안 안 쓴다고 끔).
#    그래서 /agent · /agent-dev 는 502 다 — 설정 문제가 아니니 여기를 뒤지지 말 것.
#    포털 카드도 숨김 상태라 사용자에게 노출되지 않는다.
#    다시 켜면 그대로 동작한다(라우트·NAT 모두 그대로 두었다). 이 주석은 그때 지운다.
location /agent {
    proxy_pass http://10.10.10.6:5000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    client_max_body_size 0;

    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;
    proxy_buffering       off;
}

# ── Agent-Platform 공유 dev 스택 (/agent-dev → :5001) ──
# 영구 tier(prod /agent 와 대칭) — 개인 스택(/agent-<id>, 아래 dynamic include)과 달리
# 여기 static 으로 둔다. dev 스택은 BASE_PATH=/agent-dev 로 프론트를 빌드하므로 경로가 1:1 로 맞는다.
# nginx longest-prefix 매칭이라 /agent(:5000)보다 /agent-dev 가 우선한다.
location /agent-dev {
    proxy_pass http://10.10.10.6:5001;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    client_max_body_size 0;

    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;
    proxy_buffering       off;
}

# ── homey-nexus (.43 k3s Traefik :80) ──
# HVD 가상화 플랫폼. 모든 tier 가 .43 k3s 로 가고, tier 구분은 base-url 경로로 한다:
#   /homey-nexus       = 운영(ns homey-nexus-system)
#   /homey-nexus-dev   = 공유 dev(ns develop)
#   /homey-nexus-<id>  = 개인(ns dev-<id>)
# nginx longest-prefix 로 이 한 location 이 위 셋을 다 잡아 .43:80(k3s Ingress=Traefik)로 넘기고,
# Traefik 이 전체 경로로 namespace Ingress 를 매칭 + StripPrefix 로 프리픽스를 떼어 pod(:8080)에 전달.
# (프론트는 그 base-url 로 빌드돼 경로가 1:1 로 맞음 — agent /agent-dev 방식.)
# ⚠️ 대상 소스는 이 레포 밖(.43 homey-nexus + k3s): 실제 응답은 `hn up-*` 배포 + k3s Traefik 이 선행돼야
#    하며, 그 전엔 /homey-nexus* 가 502(다른 서비스엔 무영향). URI 안 붙임(프리픽스 보존).
location /homey-nexus {
    proxy_pass http://10.10.10.43:80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    client_max_body_size 0;

    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;
    proxy_buffering       off;
}
# ── homey-nexus-webapp (.43:7777, k3s 밖 독립 프로세스) ──
# ⚠️ **200 인데 흰 화면이면 여기가 아니라 앱 소관이다 (실사고 2026-09-16).**
#   증상: 모든 홉이 200 으로 끩데(라우트·백엔드 정상) 화면만 비어 있다.
#   원인: 앱이 반환하는 HTML 의 자원 경로가 `/` 로 시작했다
#         (예: `<script src="/src/main.ts">` · `/@vite/client`). 브라우저는 그걸 그대로
#         `https://swp-iot.lge.com/src/main.ts` 로 부르는데, 그 경로는 어느 location 에도
#         안 걸려 `location /` 의 try_files 에서 404 난다 → JS 가 하나도 안 실리므로 흰 화면.
#   판정: `curl -sk --resolve swp-iot.lge.com:443:127.0.0.1 https://swp-iot.lge.com/homey-nexus-webapp | head -30`
#         → script src 가 `/homey-nexus-webapp/...` 가 아니면 바로 이 문제다.
#   조치(앱 소관, 이 레포 아님): `.43` 에서 Vite `base: '/homey-nexus-webapp/'` 로
#         빌드·서빙 (multibizpack · agent 와 같은 방식). `/@vite/client` 가 보이면
#         개발서버(`npm run dev`)가 떠 있는 것 — 공유 서빙은 빌드 결과로 한다.
#   ⛔ nginx 에 `/@vite/` · `/src/` location 을 파줘 맞추지 않는다 — 호스트 전역 이름공간을
#     한 앱이 선점해 다른 서비스와 충돌하고, prefix 보존 원칙도 깨진다.
# base-path 방식: 앱이 /homey-nexus-webapp 를 base 로 서빙(prefix 안 뗌 — agent/build/multibizpack 동일).
# proxy_pass 에 URI 를 붙이지 않는다(붙이면 prefix 가 잘려나감). nginx longest-prefix 라
# /homey-nexus-webapp 가 위 /homey-nexus(k3s :80)보다 우선 매칭되어 이 독립 프로세스(:7777)로 간다.
# 끝에 `/` 를 붙여 준다 — 앞의 /setup 과 같은 이유(실사고 2026-09-16).
# 앱의 base 는 규격상 `/homey-nexus-webapp/` (Vite 는 슬래시로 끝나야 한다)인데,
# 밖에 내놓는 주소·포털 카드는 슬래시 없는 `/homey-nexus-webapp` 이다.
# 그대로 넘기면 앱이 "did you mean to visit /homey-nexus-webapp/ instead?" 를 돌려준다
# (리다이렉트가 아니라 404 안내 페이지 — 사용자는 링크를 한 번 더 눌러야 한다).
# 이 차이를 흡수하는 것은 앱이 아니라 리버스프록시 일이다.
# `=` 는 정확히 이 한 경로만 잡고, 하위 경로는 아래 prefix location 이 그대로 받는다.
location = /homey-nexus-webapp { return 301 /homey-nexus-webapp/; }
location /homey-nexus-webapp {
    proxy_pass http://10.10.10.43:7777;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    client_max_body_size 0;

    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;
    proxy_buffering       off;
}

# ── collab_search (.40:4100) ──
# base-path 방식: 앱이 /collab_search 를 base path 로 서빙(prefix 안 뗌).
# 그래서 proxy_pass 에 URI 를 붙이지 않는다(붙이면 prefix 가 잘려나감).
location /collab_search {
    proxy_pass http://10.10.10.40:4100;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    client_max_body_size 0;

    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;
    proxy_buffering       off;
}
# ── MultiBizpack (.40:4000) ──
# base-path 방식: 앱이 /multibizpack 를 base path 로 서빙(prefix 안 뗌 — agent-platform·build-center 동일).
# 그래서 proxy_pass 에 URI 를 붙이지 않는다(붙이면 prefix 가 잘려나감). 프론트는 base='/multibizpack/',
# express 는 config.BASE_PATH='/multibizpack' 로 mount 되어 경로가 1:1 로 맞는다.
location /multibizpack {
    proxy_pass http://10.10.10.40:4000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket / SSE (collect 업로드 진행 스트림 — proxy_buffering off 필수)
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    client_max_body_size 0;

    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;
    proxy_buffering       off;
}

# ── homey-ai-ops (.40:4200) ──
# base-path 방식: 앱이 /homey-ai-ops 를 base 로 서빙(prefix 안 뗌 — multibizpack·agent 와 동일).
# proxy_pass 에 URI 를 붙이지 않는다(붙이면 prefix 가 잘려나감). 앱 쪽은 base='/homey-ai-ops/'.
# ⚠️ 끝 슬래시 리다이렉트를 함께 둔다 — 앱 base 는 규격상 `/` 로 끝나는데 밖에 내놓는 주소는
#    슬래시가 없다. 그대로 넘기면 화면 대신 "did you mean to visit /homey-ai-ops/ ?" 안내가 뜬다
#    (2026-09-16 /homey-nexus-webapp 에서 실제로 겪음). 차이를 흡수하는 건 리버스프록시 몫.
#    `=` 정확일치라 이 한 경로만 잡고, 하위 경로는 아래 prefix location 이 그대로 받는다.
# ⚠️ 200 인데 흰 화면이면 여기가 아니라 앱 소관 — 앱이 돌려준 HTML 의 자원 경로가 `/` 로 시작하는
#    경우다. 판정: curl 로 HTML 을 받아 script src 가 `/homey-ai-ops/` 로 시작하는지 본다.
# ⚠️ 502 면 앱이 127.0.0.1 에 묶였을 수 있다 — .42 에서 붙으므로 0.0.0.0:4200 이어야 한다.
# ※ .40 은 swp-iot-api · MultiBizpack(4000/4001) · Collab-Search(4100) 가 함께 도는 공용 서버다.
#   4200 은 그 셋과 겹치지 않게 고른 번호 — 기존 포트를 건드리지 않는다.
location = /homey-ai-ops { return 301 /homey-ai-ops/; }
location /homey-ai-ops {
    proxy_pass http://10.10.10.40:4200;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    client_max_body_size 0;

    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;
    proxy_buffering       off;
}

# ── 개발자별 개인 스택 (/agent-<id>) ──
# add_user 가 dev-routes/agent-<id>.conf 를 자동 생성(agent-platform scripts/provision/nginx-route.sh)
# → pnbctl proxy deploy 가 .42 로 rsync. 경로는 .42 파일시스템 기준 절대경로(nginx prefix 무관).
# glob 이라 파일이 0개여도 nginx 에러 없음(개발자 추가 전 안전).
include /home/riaveda/reverse-proxy/nginx/dev-routes/*.conf;

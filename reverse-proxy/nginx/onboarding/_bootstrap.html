<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>보안 연결 확인 중…</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
         text-align: center; margin-top: 22vh; color: #64748b; }
</style>
</head>
<body>
  <p>보안 연결(HTTPS)을 확인하는 중입니다…</p>
  <script>
  (function () {
    // 현재 경로(브라우저 URL 은 rewrite 로 안 바뀌므로 원래 경로 그대로)를 https 로.
    var httpsUrl = 'https://' + location.host + location.pathname + location.search;
    var guideUrl = '/setup/rootca/?from=' + encodeURIComponent(location.pathname + location.search);
    var done = false;
    function go(u) { if (!done) { done = true; location.replace(u); } }

    // https 리소스(1x1 gif)를 몰래 로드 시도 — 성공하면 이 PC 가 우리 루트를 신뢰(=경고 없음).
    // (subresource 라 TLS 실패해도 브라우저 경고 없이 조용히 onerror.)
    // ⚠️ 신뢰 표식(쿠키)은 **여기서 심지 않는다** — 그 응답에 서버가 이미 실어 보냈다.
    //    스크립트가 심은 쿠키는 브라우저가 수명을 깎기 때문이다(reverse-proxy.conf 맵 (2-1)).
    // ⚠️ 첫 https 연결은 원래 느리다(TLS 핸드셰이크·이름 해석이 처음 도는 순간). 한 번 실패했다고
    //    바로 포기하지 않고 **짧게 한 번 더** 해 본다 — 여기서 포기하면 그 대가가 아래 표식으로 남는다.
    var tries = 0;
    function probeOnce() {
      tries += 1;
      var probe = new Image();
      probe.onload  = function () { go(httpsUrl); };
      probe.onerror = function () {
        if (tries < 2) { setTimeout(probeOnce, 300); return; }
        go(guideUrl);                                   // 정말 미신뢰 → 설치 안내
      };
      probe.src = 'https://' + location.host + '/__ap_probe.gif?t=' + Date.now() + '.' + tries;
    }
    probeOnce();

    // 지연 fail-safe — 확인이 늦어도 **원래 보려던 화면을 막지 않는다.**
    //
    // ⚠️⚠️ **여기서 `skip` 을 심지 않는다.** `skip` 은 *사람이 「설치 없이 계속」을 눌렀다*는 뜻이고,
    //    그 상태에서는 확인이 **다시 돌지 않는다.** 예전엔 이 자리에서 `skip` 을 심어, 우연히 한 번
    //    느렸을 뿐인데 **그 세션 내내 http 에 갇혔다** — 브라우저를 통째로 닫아야 풀렸고, 화면에는
    //    원인이 전혀 보이지 않았다(같은 증상이 며칠 간격으로 반복됐다).
    //    → **뜻이 다르면 값도 다르게**: `slow` 는 60초만 산다. 그동안만 http 로 보고, 지나면 저절로
    //      사라져 다음 이동에서 다시 확인한다. **스스로 회복된다**는 것이 이 표식의 전부다.
    setTimeout(function () {
      document.cookie = 'ap_tls=slow;path=/;max-age=60;samesite=lax';
      go(location.href);
    }, 8000);
  })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=/setup/rootca/"></noscript>
</body>
</html>

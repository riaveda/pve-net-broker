# headscale (k3s 워커 메시 조정자) — TLS 종단 :51821
#
# 【왜 TLS 가 필요한가 — 실측 2026-09-17】
#   평문(`http://`)으로 두면 **두 가지가 깨진다**:
#     ① 중계(DERP)에 못 붙는다 — 워커의 `tailscale status` 건강 검사에 경고가 뜬다.
#        중계는 **직접 경로가 막히는 망의 유일한 길**이라, 없으면 "사무실에선 되는데 집에선 안 되는"
#        부류가 된다. (headscale 공식 문서: embedded DERP 를 쓰면 server_url 은 https 여야 한다.)
#     ② 등록된 노드의 **재등록이 500** 으로 실패한다 — tailscale 이 loopback 이 아닌 조정자 주소에
#        평문을 쓰지 않고 스스로 https 로 올려 붙기 때문이다(`TLS forced: no port 80 dialed`).
#   ⚠️ **첫 등록은 평문으로도 통과한다**(Noise 위) — 그래서 "되는 줄 알았다" 가 된다. 속지 말 것.
#
# 【왜 별도 포트인가】 headscale 은 **하위 경로 뒤 배치를 지원하지 않는다**(제품 제약).
#   그래서 `/homey-nexus` 같은 경로에 얹을 수 없고 포트를 낸다. 번호는 터널 입구(51820) 옆으로 맞췄다
#   — 대장이 "워커가 걸어 들어오는 입구들" 로 한 줄에 읽힌다. 인증서는 호스트명만 매칭하므로
#   :443 과 **같은 인증서 한 장**이 그대로 커버한다(포트 무관).
#
# 【경로】 워커 → swp-iot.lge.com:51821(TLS 종단, 여기) → 10.10.10.43:51821(headscale, 평문)
#   ⚠️ 뒤 구간이 평문인 것은 의도다 — PVE 내부망이고, 컨트롤 채널은 Noise 로,
#      중계가 나르는 것은 WireGuard 암호문이라 이미 두 겹으로 싸여 있다.
#
# 활성화: 이 파일을 ../tls-enabled/ 로 복사(= PVE 작업 트리에서) → `pnbctl proxy deploy`.
#   ⚠️ **`.42` 에서 복사하지 않는다** — 배포의 rsync 가 `--delete` 라 다음 배포에 지워진다.
#      런타임 파일의 진실원은 **PVE 의 작업 트리**다(.gitignore 주석 참조).

server {
    # ⚠️ **http2 를 켜지 않는다.** HTTP/2 에는 `Upgrade` 헤더가 없어서, 켜면 컨트롤 프로토콜 승격과
    #   중계(DERP) 웹소켓이 조용히 안 선다 — 등록은 되고 중계만 안 되는 **가장 찾기 어려운 모양**이 된다.
    listen 51821 ssl;
    listen [::]:51821 ssl;

    server_name swp-iot.lge.com;

    ssl_certificate     /etc/nginx/ssl/swp-iot.lge.com.crt;
    ssl_certificate_key /etc/nginx/ssl/swp-iot.lge.com.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # 접속 로그는 남기되 헬스 잡음은 없다(이 포트로 오는 것은 워커뿐).
    access_log /var/log/nginx/headscale.access.log;
    error_log  /var/log/nginx/headscale.error.log;

    location / {
        proxy_pass http://10.10.10.43:51821;

        # ⚠️ 승격(Upgrade) 통과 — 컨트롤 프로토콜(`Upgrade: tailscale-control-protocol`)과
        #   중계 웹소켓(`/derp`)이 **같은 경로**로 온다. `$connection_upgrade` 맵은 reverse-proxy.conf:1.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ **버퍼링을 끈다.** 중계는 오래 살아 있는 스트림이라, 버퍼에 모았다 보내면
        #   패킷이 고이고 지연이 튄다(중계가 "되는데 느린" 상태가 된다).
        proxy_buffering off;
        proxy_request_buffering off;

        # 컨트롤 연결은 **오래 기다리는 것이 정상**이다(long-poll). 기본 60초로 두면
        # 워커가 주기적으로 끊겼다 붙으며 노드 상태가 깜빡인다.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;

        client_max_body_size 0;
    }
}

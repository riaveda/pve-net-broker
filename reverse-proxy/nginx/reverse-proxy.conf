map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─────────────────────────────────────────────────────────────────────────────
# 브라우저 https 유도 (조건부 리다이렉트 / probe) 판별 맵
#   목적: :80 브라우저 접속을 — 루트 신뢰 PC → https(:443) 리다이렉트, 미신뢰 → 설치 가이드로.
#   기계 클라이언트(git·MCP·BYOH)는 여기서 자동 제외 → http 그대로 통과(안 깨짐).
#   ★ 활성화 전엔 완전 무효: redirect-enabled/ 가 비어 있으면 $ap_toggle=0 → 항상 "proxy".
#   상세·사유: reverse-proxy/docs/https-transition-rationale.md §4·§7
# ─────────────────────────────────────────────────────────────────────────────

# (1) 브라우저 top-level navigation 인가 — 기계 클라이언트/서브리소스는 0.
map $http_accept $ap_nav_accept {          # Sec-Fetch 없는 구형 브라우저 fallback (먼저 정의)
    "~*text/html"  1;
    default        0;
}
map $http_sec_fetch_mode $ap_nav {
    "navigate"  1;
    default     $ap_nav_accept;
}

# (2) 루트 신뢰 상태 쿠키 — 1=신뢰(→https) · skip=사람이 "설치 안 함"을 고름 · slow=확인이 느렸음 · 그 외=미확인.
#
# ⚠️⚠️ **의도와 사고에 같은 표식을 쓰지 않는다.** 예전엔 확인(probe)이 느릴 때도 `skip` 을 심었는데,
#      `skip` 상태에서는 확인이 **다시 돌지 않으므로** 우연한 지연 한 번이 "사용자가 거부했다"로 굳어
#      **그 세션 내내 http 에 갇혔다**(브라우저를 통째로 닫아야 풀렸다 — 원인이 전혀 안 보인다).
#      뜻이 다르면 값도 달라야 한다:
#        · `skip` = **의도** — 사람이 눌렀다. **30분간** 존중하고 그 뒤 다시 확인한다.
#        · `slow` = **사고** — 확인이 느렸다. **짧게 살고 스스로 사라진다**(60초) → 다음 이동에서 다시 확인.
#      둘 다 http 로 서빙하는 것은 같지만, 회복되기까지가 다르다.
# ⚠️⚠️ **한 창에서 표명된 의도를 전체에 무기한 적용하지 않는다.** 이 표식은 `Path=/` 라 브라우저
#    프로필 전체에 걸리고, 설치형 앱(PWA)은 브라우저와 **같은 쿠키 저장소**를 쓴다 — 탭에서 누른
#    「설치 없이 계속」이 **아무 상관 없는 앱 창까지** http 로 끌고 내려간다. 앱에는 주소창도 안내도
#    없어 사용자는 원인을 못 본다.
#    그래서 수명을 **30분**으로 둔다. 세션 쿠키(만료 없음)도 안 되고 24시간도 안 된다 —
#    · 세션: 앱 창이 떠 있으면 크롬 프로세스가 안 죽어 **며칠씩** 살아남았다(실사고).
#    · 24시간: 루트를 이미 설치한 PC 도 하루 동안 갇혔다.
map $cookie_ap_tls $ap_tls_state {
    "1"      "trust";
    "skip"   "skip";
    "slow"   "skip";   # 서빙 동작은 skip 과 같다 — 다른 점은 **60초 뒤 저절로 없어진다**는 것
    default  "unknown";
}

# (2-1) 신뢰 표식은 **서버가 심는다** — https 로 응답이 성사됐다는 사실 자체가 그 PC 가 우리 루트를
#       신뢰한다는 증거이므로, 그 응답에 그대로 표식을 실어 보낸다.
#   ⚠️ 브라우저 스크립트(document.cookie)로 심지 않는다 — 브라우저가 스크립트가 심은 쿠키의
#      수명을 임의로 깎는다(예: Safari 는 7일). 서버가 준 Set-Cookie 는 그대로 산다.
#   ⚠️ **무한 수명은 브라우저가 허용하지 않는다** — 400일이 상한이고 그보다 길게 적으면 잘린다.
#      그래서 상한값(400일)을 쓰고, 만료돼도 다음 접속의 확인(probe)이 조용히 다시 심는다.
#      즉 기간은 "언젠가 끊기 위한 것"이 아니라 **낡은 표식에서 빠져나오는 유일한 길**이다.
#   http(:80) 응답에는 빈 값 → nginx 가 값이 빈 add_header 는 아예 내보내지 않는다.
map $scheme $ap_trust_cookie {
    https   "ap_tls=1; Path=/; Max-Age=34560000; SameSite=Lax";
    default "";
}

# (2-2) https 응답에 **Upgrade Insecure Requests**(W3C 표준 CSP 지시어)를 싣는다 — 값이 비면 nginx 가
#       헤더를 내보내지 않으므로 :80 응답은 그대로다.
#   ⚠️ 왜 필요한가 (실사고 2026-09-16): 크롬은 이 호스트의 **어느** https 페이지든 `http://` 스크립트·fetch·
#      iframe 을 한 번 *실행*하면 "이 호스트가 안전하지 않은 콘텐츠를 실행했다" 를 **호스트 단위로, 브라우저
#      프로세스가 살아 있는 동안** 기억하고, 그 뒤 같은 호스트의 **모든** https 페이지에 「주의 요함 ·
#      active mixed content」를 붙인다. 사내 크롬 정책(`InsecureContentAllowedForUrls`)이 그 실행을
#      막지 않고 통과시키므로, 같은 호스트에 있는 다른 서비스 페이지 하나가 `http://` 절대주소를 쓰면
#      **아무 잘못 없는 앱까지** 경고를 받는다(설치형 앱 창은 프로세스를 살려 둬 기억이 며칠 간다).
#   → 이 지시어가 있으면 브라우저가 `http://` 하위 요청을 **보내기 전에** `https://` 로 바꾼다.
#      실행이 0 이면 기억도 0 → 정책·프로필·브라우저와 무관하게 **어느 사용자도 경고를 보지 않는다.**
#      :80·:443 이 같은 라우팅(_service-routes)이라 바뀐 요청은 그대로 성립한다.
#   ⚠️ 유일한 대가: https 가 없는 **바깥** http 자원을 쓰는 옛 페이지는 그 자원만 안 실린다 — 그것이 곧
#      경고를 만들던 범인이고, 그 페이지 소유 팀이 주소를 고칠 일이다(DevTools Network `mixed-content:all`).
#   ⚠️ 이 헤더는 정책 그 자체(사이트 권한)를 없애지 못한다 — 권한은 남지만 쓰일 일이 없어진다.
#      옛 표기 "관리자가 허용함이면 우리 쪽에서 없앨 방법이 없다" 는 *권한*에 대한 말이었고 *경고*에는 틀렸다.
map $scheme $ap_csp_upgrade {
    https   "upgrade-insecure-requests";
    default "";
}

# (3) 리다이렉트 대상 경로만 — 포털(/) · /agent* (agent·agent-dev·개인스택 agent-<id> 전부) · /build*
#     · /homey-nexus* · /multibizpack.
#     비-브라우저(curl /agent/sdk 등)는 (1) 에서 걸러짐.
#     ⚠️ **제외는 빠뜨려서가 아니라 이유가 있다 — 무심코 추가하지 말 것:**
#     · `/gitlab`  = **영구 제외.** https 강제시 git clone/push 가 깨진다(GitLab 자체 `external_url`
#       이 http 이고 그건 .36 소관). 근거: docs/https-transition-rationale.md §6·§79.
#     · `/collab_search` = 2026-09-16 **포함 확정** (아래 목록에 있음).
#       예전엔 "앱이 https 로 렌더되나" 를 못 명해 보류했으나(§80), 실제로 넣고
#       브라우저로 확인한 결과 정상 동작해 유지하기로 했다.
#       (CSP upgrade-insecure-requests 가 먼저 들어와 mixed content 위험이 사라진 덕도 있다.)
#     · `/setup`·probe = 자기 자신을 리다이렉트하면 루프가 된다.
map $uri $ap_redirect_path {
    "~^/agent"        1;
    "~^/build"        1;
    "~^/homey-nexus"  1;   # 운영 · 공유 dev · 개인 스택(/homey-nexus-<id>) 전부
    "~^/multibizpack" 1;   # 2026-09-16 추가 (포털 카드 신설로 클릭 경로가 생김)
    "~^/collab_search" 1;  # 2026-09-16 포함 확정 (브라우저 확인 완료)
    "~^/$"            1;
    default           0;
}

# (4) 종합 디스패치: toggle:신뢰상태:nav:대상 → 행동.
map "$ap_toggle:$ap_tls_state:$ap_nav:$ap_redirect_path" $ap_dispatch {
    "~^1:trust:[01]:1$"    "https";      # 신뢰 PC → https 리다이렉트
    "~^1:unknown:1:1$"     "bootstrap";  # 미확인 + 브라우저 nav → probe 부트스트랩
    default                "proxy";      # 그 외(기계·skip·비대상·비활성) → 정상 서빙
}

# ── HTTP (:80) — 현재 서빙 경로 ──
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name swp-iot.lge.com;

    # https 유도 토글: 기본 off. 활성화 시 redirect-enabled/on.conf(=`set $ap_toggle 1;`)가 켠다.
    # (tls 인증서 배치 + tls-enabled 활성화가 선행돼야 probe 대상 :443 이 존재 — docs/tls-setup.md.)
    set $ap_toggle 0;
    include /home/riaveda/reverse-proxy/nginx/redirect-enabled/*.conf;

    # 브라우저만 https 유도 — 기계 클라이언트·비대상 경로는 $ap_dispatch="proxy" 라 아래 if 에 안 걸림.
    if ($ap_dispatch = "https")     { return 301 https://$host$request_uri; }
    if ($ap_dispatch = "bootstrap") { rewrite ^ /__ap_bootstrap last; }

    include /home/riaveda/reverse-proxy/nginx/_service-routes.conf;
}

# ── HTTPS (:443, HTTP/2) — 【활성】 ──
# tls-enabled/ 가 비어 있으면 HTTPS server 블록이 없어 현행 :80 그대로다(= 지금 상태).
# 인증서를 만들고(scripts/gen-certs.sh) .42 에 배치한 뒤, tls-available/<...>.conf 를
# tls-enabled/ 로 복사하면 그때 비로소 :443 이 켜진다. 그 전엔 완전 dormant(기존 서비스 무영향).
# (glob 이라 비어 있어도 nginx 에러 없음 — dev-routes 와 동일 안전 패턴.) 절차: docs/tls-setup.md
include /home/riaveda/reverse-proxy/nginx/tls-enabled/*.conf;
